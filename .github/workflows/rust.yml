name: Rust

on:
  push:
    branches: [ master, rust/pilot ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [ master, rust/pilot ]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Build workspace
        run: cargo build --workspace

  android-smoke:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-rust-android-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-android-
            ${{ runner.os }}-rust-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Android NDK
        run: |
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "ANDROID_HOME is not set by the runner" >&2
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android aarch64 GDExtension
        run: ./scripts/android-build.sh
